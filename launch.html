<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Day Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .badge {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 6px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .target-date {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .time-box {
            background: #0f172a;
            padding: 15px 10px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .time-box .num {
            font-size: 2.5rem;
            font-weight: 800;
            color: #38bdf8;
            line-height: 1.1;
        }

        .time-box .label {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #4ade80;
            font-weight: 600;
            min-height: 1.5em;
        }

        @media (max-width: 480px) {
            .time-box .num {
                font-size: 1.8rem;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="badge">MISSION COUNTDOWN</div>
        <h1>App Launching Soon 🚀</h1>
        <div class="target-date">Target: 2026. 10. 04 01:00 AM (KST)</div>

        <div class="timer-grid">
            <div class="time-box">
                <div class="num" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <div class="num" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="time-box">
                <div class="num" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>
            <div class="time-box">
                <div class="num" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <div class="status-msg" id="status-msg">시스템 출전 대기 중...</div>
    </div>

    <script>
        // 목표 시각: 2026년 10월 4일 01:00:00 (한국 표준시)
        const targetDate = new Date("2026-10-04T01:00:00+09:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.getElementById("status-msg").innerText = "🎉 LAUNCHED! 출격 완료!";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>

</html>
